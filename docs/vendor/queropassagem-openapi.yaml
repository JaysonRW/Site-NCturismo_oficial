        url:
          type: string
          example: "tiete-sp"
        latitude:
          type: string
          example: "-23.51620000"
        longitude:
          type: string
          example: "-46.62695940"
        address:
          type: string
          nullable: true
          example: "Av. Cruzeiro do Sul, 1800 - Santana São Paulo, SP - 02030-000 (11) 3866-1100"
        zipcode:
          type: string
          example: "99999-999"
          nullable: true
        type:
          type: string
          enum:
            - station
            - city
        sub_type:
          type: string
          enum:
            - others
            - station
            - gas_station
            - hotel
            - airport
            - restaurant
          description: The detailed type of this location (only for stations).
        station:
          type: array
          nullable: true
          items:
