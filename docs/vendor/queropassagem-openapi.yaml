              example: 1
            y:
              type: integer
              description: The y-coordinate of the seat's position.
              example: 0
            z:
              type: integer
              description: The z-coordinate of the seat's position.
              example: 0
        occupied:
          type: boolean
          description: Indicates if the seat is occupied.
          example: true
        type:
          type: string
          description: The type of element in the seat map (possible values are seat or emptyOrReservedSpace).
