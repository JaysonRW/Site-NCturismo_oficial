        creditCard:
          type: array
          items:
            $ref: '#/components/schemas/PaymentOptionSchema'
          description: A list of payment options for credit card payments.
        pix:
          type: array
          items:
            $ref: '#/components/schemas/PaymentOptionSchema'
          description: A list of payment options for pix payments.
    PaymentOptionSchema:
      type: object
      properties:
