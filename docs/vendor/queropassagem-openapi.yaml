          example: "012.345.678-90"
        birthDate:
          type: string
          description: "The birth date for the insurance policy. Note: the format here is DD/MM/YYYY."
          example: "01/01/2000"
        cep:
          type: string
          description: The postal code.
          example: "99999-999"
    CancellationDetailsSchema:
      type: object
      properties:
        limitDate:
          type: string
          format: date-time
          description: The deadline for cancellation.
          example: "2025-08-20 19:30:00"
        allowed:
          type: boolean
          description: Indicates if cancellation is allowed.
          example: true
        fee:
          type: number
          format: float
          description: The cancellation fee.
          example: 0
    AmenitiesDetailsSchema:
      type: object
      properties:
        icon:
          type: string
          description: Icon name or url if type is svg
          example: ac_unit
        type:
          type: string
          description: Icon type
          example: material
        title:
          type: string
          description: Icon title
          example: Ar-condicionado

    #Payment
    PaymentKeySchema:
      type: object
      properties:
        key:
          type: string
          example: "2FuCtG5KTYDa6C2i9hs74Nolw8q8E9ZJErnrCsB..."

    #Connection
    ConnectionSuggestionsSchema:
      type: array
      items:
        type: object
        properties:
          from:
            type: string
            description: Station ID where the connection starts.
            example: ROD_1
          node:
            type: string
            description: Station ID where the connection occurs.
            example: ROD_7
          to:
            type: string
            description: Station ID where the connection finishes.
            example: ROD_55

    #Default
    DefaultErrorSchema:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
          example:
            - "Error X"
            - "Error Y"
    PurchaseListSchema:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier for the reservation.
          example: 123456
        email:
          type: string
          format: email
          description: The email address associated with the reservation.
          example: "email@email.com"
        status:
          type: string
          description: The current status of the reservation.
          example: "paid"
        date:
          type: string
          format: date-time
          description: The date and time the reservation was made.
          example: "2025-08-11 13:54:21"
        payment:
          type: object
          properties:
            total:
              type: number
              format: float
              description: The total amount paid.
              example: 545.01
            method:
              type: string
              description: The payment method.
              example: "preApproved"
            installment:
              type: integer
              description: The number of payment installments.
              example: 1
        externalId:
          type: string
          description: An external identifier for the reservation.
          example: "ABC123"
    PurchaseSchema:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier for the reservation.
          example: 123456
        externalId:
          type: string
          description: An external identifier for the reservation.
          example: "ABC123"
        email:
          type: string
          format: email
          description: The email address associated with the reservation.
          example: "email@email.com"
        buyer:
          $ref: '#/components/schemas/BuyerSchema'
        payment:
          $ref: '#/components/schemas/PaymentSchema'
        status:
          type: string
          description: The current status of the reservation.
          example: "paid"
        date:
          type: string
          format: date-time
          description: The date and time the reservation was made.
          example: "2025-08-11 13:54:21"
        travels:
          type: array
          items:
            $ref: '#/components/schemas/Travel'
    BuyerSchema:
      type: object
      properties:
        name:
          type: string
          description: The buyer name.
          example: "John Doe"
    PaymentSchema:
      type: object
      properties:
        total:
          type: number
          format: float
          description: The total amount paid.
          example: 545.01
        tax:
          type: number
          format: float
          description: The tax amount.
          example: 81.46
        insurance:
          type: number
          format: float
          description: The insurance amount.
          example: 10.95
        tickets:
          type: number
          format: float
          description: The ticket amount.
          example: 452.6
        discount:
          type: number
          format: float
          description: The discount amount.
          example: 0
        method:
          type: string
          description: The payment method.
          example: "preApproved"
        refunded:
          type: number
          format: float
          description: The amount refunded.
          example: 0
        installment:
          type: integer
          description: The number of payment installments.
          example: 1
        toll:
          type: number
          format: float
          description: The toll amount.
          example: 0
        authorizationCode:
          type: string
          description: The authorization code from credit card.
          example: "401466"
    Travel:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/LocationSchema'
        to:
          $ref: '#/components/schemas/LocationSchema'
        departure:
          $ref: '#/components/schemas/DateTimeSchema'
        arrival:
          $ref: '#/components/schemas/DateTimeSchema'
        company:
          $ref: '#/components/schemas/CompanySchema'
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/PassengerSchema'
        travelCancellationLimitDate:
          type: string
          format: date-time
          description: The cancellation deadline for the travel segment.
          example: "2025-08-11 15:00:00"
    LocationSchema:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the location.
          example: "ROD_3"
        label:
          type: string
          description: The human-readable name of the location.
          example: "Campinas, SP - Terminal Ramos de Azevedo"
        customLabel:
          type: string
          description: The custom human-readable name of the location for this company. If it does not exist null is provided.
          example: "Campinas, SP - Terminal Ramos de Azevedo"
        customAddress:
          type: string
          description: The custom human-readable address of the location for this company. If it does not exist null is provided.
          example: "Endereço: Rod. Anhanguera, Km 99, S/n - Jardim Eulina, Campinas - SP, 13063-000."
    DateTimeSchema:
      type: object
      properties:
        date:
          type: string
          format: date
          description: The date of departure or arrival.
          example: "2025-08-26"
        time:
          type: string
          format: time
          description: The time of departure or arrival.
          example: "19:00:00"
    CompanySchema:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the company.
          example: "12"
        name:
          type: string
          description: The name of the company.
          example: "Garcia"
    PassengerSchema:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier for the passenger.
          example: 123456
        name:
          type: string
          description: The passenger's name.
          example: "Jane Doe"
        travelDocument:
          type: string
          description: The passenger's travel document number.
          example: "123456"
        travelDocumentType:
          type: string
          description: The type of travel document.
          example: "RG"
        seatNumber:
          type: string
          description: The passenger's seat number.
          example: "73"
        seatClass:
          type: string
          description: The class of the seat.
          example: "LEITO CAMA"
        bpe:
          type: string
          format: uri
          description: The URL for the electronic ticket (BPE).
          example: "https://queropassagem.com.br/..."
        ticket:
          type: string
          description: The ticket number.
          example: "ABC123"
        state:
          type: string
          description: The state of the ticket (e.g., emitted).
          example: "emitted"
        canceled_by:
          type: string
          nullable: true
          description: The entity that canceled the ticket, if applicable.
          example: null
        modifiable:
          type: boolean
          description: Indicates if the ticket can be modified.
          example: false
        birthDate:
          type: string
          format: date
          description: The passenger's birth date.
          example: "1998-08-11"
        insurance:
          $ref: '#/components/schemas/InsuranceSchema'
        cancellation:
          $ref: '#/components/schemas/CancellationSchema'
    InsuranceSchema:
      type: object
      properties:
        cpf:
          type: string
          description: The CPF number.
          example: "012.345.678-90"
        birthDate:
          type: string
          format: date
          description: The birth date for the insurance policy.
          example: "1998-08-11"
        cep:
          type: string
          description: The CEP number.
          example: "99999-999"
        state:
          type: string
          description: The state of the insurance policy.
          example: "emitted"
        voucher:
          type: string
          description: The insurance voucher number.
          example: "123456"
    CancellationSchema:
      type: object
      properties:
        allowed:
          type: boolean
          description: Indicates if cancellation is allowed.
          example: false
        fee:
          type: number
          format: float
          description: The cancellation fee.
          example: 0
    StopDetailStationSchema:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the station.
          example: "ROD_1"
        name:
          type: string
          description: The name of the station.
          example: "São Paulo, SP - Tietê"
    StopDetailCitySchema:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the city.
          example: "CIT_1"
        name:
          type: string
          description: The name of the city.
          example: "São Paulo, SP"
    IntegerSchema:
      type: integer
      format: int32
      minimum: 1
  parameters:
    FromParam:
      name: from
      in: path
      required: true
      description: Origin station or city id
      schema:
        type: string
      example: ROD_1
    ToParam:
      name: to
      in: path
      required: true
      description: Destination station or city id
      schema:
        type: string
      example: CIT_15
    TravelDateParam:
      name: travelDate
      in: path
      required: true
      description: Date of travel in YYYY-MM-DD format
      schema:
        type: string
        format: date
      example: "2026-09-15"
    AffiliateCodeParam:
      name: affiliateCode
      in: path
      required: true
      description: Your affiliate code
      schema:
        type: string
      example: ABC
