          format: float
          description: The price of the seat(s).
          example: 100
        taxPrice:
          type: number
          format: float
          description: The tax amount.
          example: 20
        insurancePrice:
          type: number
          format: float
          description: The insurance price.
          example: 18
        total:
          type: number
          format: float
          description: The total price.
          example: 138
    InstalmentSchema:
      type: object
      properties:
        instalments:
          type: integer
          description: The number of instalments.
          example: 1
        value:
          type: number
          format: float
          description: The value of each instalment.
          example: 138
    TravelDetailsSchema:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the travel segment.
          example: "1_cbeeaccf9bc476d5360759d78610dc29"
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/PassengerDetailsSchema'
    PassengerDetailsSchema:
      type: object
      properties:
        name:
          type: string
          description: The passenger's name.
          example: "John Doe"
        travelDocument:
          type: string
          description: The passenger's travel document number.
          example: "123456"
        travelDocumentType:
          type: string
          description: The type of travel document.
          example: "RG"
        seatNumber:
          type: string
          description: The assigned seat number.
          example: "10"
        birthDate:
          type: string
          format: date
          description: The passenger's date of birth.
          example: "2000-01-01"
        cpf:
          type: string
          description: The passenger's CPF number.
          example: "012.345.678-90"
        insurance:
          $ref: '#/components/schemas/InsuranceDetailsSchema'
        cancellation:
          $ref: '#/components/schemas/CancellationDetailsSchema'
    InsuranceDetailsSchema:
      type: object
      properties:
        cpf:
          type: string
